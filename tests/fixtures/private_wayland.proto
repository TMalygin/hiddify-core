syntax = "proto3";
package private_wayland_acceptance;

// Wire contract independent of the server artifact, including the pre-feature core.
message Request {
  repeated string command = 1;
  string application_id = 2;
  string executable_root = 3;
  bool chromium_sandbox = 4;
  bool private_wayland = 5;
}

message Event {
  enum State { OFFLINE = 0; ONLINE = 1; ERROR = 2; EXITED = 3; OUTPUT = 4; }
  State state = 1;
  uint64 revision = 2;
  bytes stdout = 3;
  bytes stderr = 4;
  int32 exit_code = 5;
  string message = 6;
}
